<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Toderos Facatativá</title>
  <!-- Estilos globales -->
  <link rel="stylesheet" href="css/styles.css">
  <!-- Estilos de pantalla -->
  <link rel="stylesheet" href="css/registro.css">
</head>
<body>

  <!-- Contenedor principal de la pantalla móvil -->
  <main class="mobile-view">
    
    <!-- Enlace superior para volver -->
    <div class="register-top-nav">
      <a href="index.html">&larr; Volver al inicio de sesión</a>
    </div>

    <!-- Encabezado -->
    <header class="site-header">
      <div class="brand-logo-box">TF</div>
      <h1 class="brand-name">TODEROS APP</h1>
      <h2>Crear Cuenta</h2>
      <p>Regístrate para solicitar u ofrecer servicios en Facatativá</p>
    </header>

    <!-- Formulario de registro -->
    <form action="buscar-servicios.html" method="get">
      
      <!-- Selección de rol -->
      <fieldset class="role-selection">
        <legend>Tipo de usuario</legend>
        <div class="role-radios">
          <label>
            <input type="radio" name="rol" value="cliente" checked> Cliente
          </label>
          <label>
            <input type="radio" name="rol" value="todero"> Todero (Prestador)
          </label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" required>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono celular:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ej. 310 000 0000" required>
      </div>

      <div class="form-group">
        <label for="ciudad">Municipio:</label>
        <input type="text" id="ciudad" name="ciudad" value="Facatativá" readonly>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirmar contraseña:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite tu contraseña" required>
      </div>

      <div class="terms-checkbox-box">
        <label>
          <input type="checkbox" name="terminos" required>
          Acepto los términos de servicio y políticas de privacidad
        </label>
      </div>

      <div class="form-group">
        <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
      </div>

      <div class="divider-simple">
        <span>o</span>
      </div>

      <div class="form-group">
        <a href="buscar-servicios.html" class="btn btn-secondary btn-block">Continuar con Google</a>
      </div>

    </form>

    <!-- Enlace al login -->
    <footer class="register-footer-links">
      <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
    </footer>

  </main>

</body>
</html>
